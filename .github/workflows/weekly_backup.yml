name: Weekly Supabase Backup

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger from Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Export and email backup
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import csv, io, os, smtplib, sys, requests
          from datetime import datetime, timezone
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders

          SUPABASE_URL   = "https://tekyplozelrvddxobval.supabase.co"
          SUPABASE_KEY   = os.environ["SUPABASE_SERVICE_KEY"]
          GMAIL_USER     = "knienu@gmail.com"
          GMAIL_PASSWORD = os.environ["GMAIL_APP_PASSWORD"]
          TO_EMAIL       = "knienu@gmail.com"

          def fetch_all():
              rows, page_size, offset = [], 1000, 0
              headers = {"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"}
              while True:
                  resp = requests.get(
                      f"{SUPABASE_URL}/rest/v1/contributions",
                      headers={**headers, "Range": f"{offset}-{offset + page_size - 1}"},
                      params={"select": "*", "order": "id.asc"},
                  )
                  resp.raise_for_status()
                  batch = resp.json()
                  rows.extend(batch)
                  if len(batch) < page_size:
                      break
                  offset += page_size
              return rows

          rows = fetch_all()
          print(f"{len(rows)} rows fetched")
          if not rows:
              sys.exit(0)

          buf = io.StringIO()
          writer = csv.DictWriter(buf, fieldnames=list(rows[0].keys()))
          writer.writeheader()
          writer.writerows(rows)
          csv_bytes = buf.getvalue().encode("utf-8")

          stamp    = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          filename = f"chokri_contributions_{stamp}.csv"

          msg = MIMEMultipart()
          msg["From"]    = GMAIL_USER
          msg["To"]      = TO_EMAIL
          msg["Subject"] = f"Chokri DB Backup — {stamp} ({len(rows)} rows)"
          msg.attach(MIMEText(
              f"Weekly backup of the Chokri contributions table.\n\nRows: {len(rows)}\nDate: {stamp} UTC\n\nSee attached.",
              "plain"
          ))
          part = MIMEBase("application", "octet-stream")
          part.set_payload(csv_bytes)
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", f'attachment; filename="{filename}"')
          msg.attach(part)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(GMAIL_USER, GMAIL_PASSWORD)
              server.sendmail(GMAIL_USER, TO_EMAIL, msg.as_string())
          print("Email sent.")
          EOF
