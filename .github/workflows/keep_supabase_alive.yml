name: Keep Supabase Active

on:
  schedule:
    # Mondays and Thursdays at 08:00 UTC. Day-of-week based (not
    # day-of-month) so the gap between runs is always <= 4 days,
    # regardless of month length -- the old '*/5 * *' day-of-month
    # schedule could leave an 8-day gap across a short month (e.g.
    # Feb 25 -> Mar 5), which exceeds Supabase's 7-day pause threshold.
    - cron: '0 8 * * 1,4'
  workflow_dispatch:          # Allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://tekyplozelrvddxobval.supabase.co/rest/v1/contributions?select=id&limit=1")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status — check Supabase project"
            exit 1
          fi
